<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Malabar Spinach Disease Detection</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 30px;
        text-align: center;
      }

      .header h1 {
        font-size: 2.5em;
        margin-bottom: 10px;
      }

      .header p {
        font-size: 1.2em;
        opacity: 0.9;
      }

      .main-content {
        padding: 40px;
      }

      .upload-section {
        text-align: center;
        margin-bottom: 40px;
      }

      .upload-area {
        border: 3px dashed #667eea;
        border-radius: 15px;
        padding: 60px 20px;
        transition: all 0.3s ease;
        cursor: pointer;
        background: #f8f9ff;
      }

      .upload-area:hover {
        border-color: #764ba2;
        background: #f0f2ff;
      }

      .upload-area.dragover {
        border-color: #764ba2;
        background: #e8ebff;
        transform: scale(1.02);
      }

      .upload-icon {
        font-size: 4em;
        color: #667eea;
        margin-bottom: 20px;
      }

      .upload-text {
        font-size: 1.3em;
        color: #333;
        margin-bottom: 15px;
      }

      .upload-subtext {
        color: #666;
        font-size: 1em;
      }

      #fileInput {
        display: none;
      }

      .btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 15px 30px;
        border-radius: 10px;
        font-size: 1.1em;
        cursor: pointer;
        transition: all 0.3s ease;
        margin: 10px;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
      }

      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .analysis-section {
        display: none;
        margin-top: 40px;
      }

      .results-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
        margin-top: 30px;
      }

      .image-preview {
        text-align: center;
      }

      .image-preview img {
        max-width: 100%;
        max-height: 400px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }

      .results-panel {
        background: #f8f9ff;
        padding: 30px;
        border-radius: 15px;
        border-left: 5px solid #667eea;
      }

      .disease-card {
        background: white;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 15px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        border-left: 4px solid;
      }

      .disease-card.healthy {
        border-left-color: #28a745;
      }

      .disease-card.medium {
        border-left-color: #ffc107;
      }

      .disease-card.high {
        border-left-color: #dc3545;
      }

      .disease-name {
        font-size: 1.3em;
        font-weight: bold;
        margin-bottom: 10px;
      }

      .confidence {
        font-size: 1.1em;
        margin-bottom: 10px;
      }

      .severity {
        display: inline-block;
        padding: 5px 15px;
        border-radius: 20px;
        font-size: 0.9em;
        font-weight: bold;
        margin-bottom: 15px;
      }

      .severity.none {
        background: #d4edda;
        color: #155724;
      }
      .severity.medium {
        background: #fff3cd;
        color: #856404;
      }
      .severity.high {
        background: #f8d7da;
        color: #721c24;
      }

      .recommendation {
        background: #e9ecef;
        padding: 20px;
        border-radius: 10px;
        margin-top: 20px;
      }

      .loading {
        display: none;
        text-align: center;
        padding: 40px;
      }

      .loading-spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #667eea;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .error {
        background: #f8d7da;
        color: #721c24;
        padding: 20px;
        border-radius: 10px;
        margin-top: 20px;
        border-left: 4px solid #dc3545;
        display: none;
      }

      @media (max-width: 768px) {
        .results-grid {
          grid-template-columns: 1fr;
        }

        .header h1 {
          font-size: 2em;
        }

        .main-content {
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Malabar Spinach Disease Detection</h1>
        <p>AI-powered disease detection for malabar spinach leaves using YOLOv8</p>
      </div>

      <div class="main-content">
        <div class="upload-section">
          <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📸</div>
            <div class="upload-text">Drop your malabar spinach leaf image here</div>
            <div class="upload-subtext">
              or click to browse (JPG, PNG supported)
            </div>
          </div>
          <input type="file" id="fileInput" accept="image/*" />
          <br />
          <button class="btn" id="uploadBtn">Choose Image</button>
          <button class="btn" id="analyzeBtn" disabled>Analyze Disease</button>
        </div>

        <div class="loading" id="loading">
          <div class="loading-spinner"></div>
          <p>Analyzing your malabar spinach leaf for diseases...</p>
        </div>

        <div class="error" id="error"></div>

        <div class="analysis-section" id="analysisSection">
          <h2>🔬 Analysis Results</h2>
          <div class="results-grid">
            <div class="image-preview">
              <h3>📷 Your Image</h3>
              <img id="previewImage" alt="Uploaded image" />
            </div>
            <div class="results-panel">
              <h3>🩺 Diagnosis</h3>
              <div id="resultsContent"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const fileInput = document.getElementById("fileInput");
      const uploadArea = document.getElementById("uploadArea");
      const uploadBtn = document.getElementById("uploadBtn");
      const analyzeBtn = document.getElementById("analyzeBtn");
      const loading = document.getElementById("loading");
      const error = document.getElementById("error");
      const analysisSection = document.getElementById("analysisSection");
      const previewImage = document.getElementById("previewImage");
      const resultsContent = document.getElementById("resultsContent");

      let selectedFile = null;

      // Upload area click handler
      uploadArea.addEventListener("click", () => fileInput.click());
      uploadBtn.addEventListener("click", () => fileInput.click());

      // Drag and drop handlers
      uploadArea.addEventListener("dragover", (e) => {
        e.preventDefault();
        uploadArea.classList.add("dragover");
      });

      uploadArea.addEventListener("dragleave", () => {
        uploadArea.classList.remove("dragover");
      });

      uploadArea.addEventListener("drop", (e) => {
        e.preventDefault();
        uploadArea.classList.remove("dragover");
        const files = e.dataTransfer.files;
        if (files.length > 0) {
          handleFileSelection(files[0]);
        }
      });

      // File input change handler
      fileInput.addEventListener("change", (e) => {
        if (e.target.files.length > 0) {
          handleFileSelection(e.target.files[0]);
        }
      });

      // Analyze button handler
      analyzeBtn.addEventListener("click", analyzeImage);

      function handleFileSelection(file) {
        if (!file.type.startsWith("image/")) {
          showError("Please select a valid image file (JPG, PNG)");
          return;
        }

        selectedFile = file;

        // Show preview
        const reader = new FileReader();
        reader.onload = (e) => {
          previewImage.src = e.target.result;
        };
        reader.readAsDataURL(file);

        // Update UI
        uploadArea.innerHTML = `
                <div class="upload-icon">✅</div>
                <div class="upload-text">Image selected: ${file.name}</div>
                <div class="upload-subtext">Click "Analyze Disease" to start diagnosis</div>
            `;

        analyzeBtn.disabled = false;
        hideError();
      }

      async function analyzeImage() {
        if (!selectedFile) {
          showError("Please select an image first");
          return;
        }

        // Show loading
        loading.style.display = "block";
        analysisSection.style.display = "none";
        hideError();

        try {
          const formData = new FormData();
          formData.append("file", selectedFile);

          const response = await fetch("/diagnose", {
            method: "POST",
            body: formData,
          });

          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }

          const data = await response.json();
          displayResults(data);
        } catch (err) {
          console.error("Analysis error:", err);
          showError(
            "Failed to analyze image. Please try again or check your connection."
          );
        } finally {
          loading.style.display = "none";
        }
      }

      function displayResults(data) {
        let resultsHTML = "";

        if (data.total_detections === 0) {
          resultsHTML = `
                    <div class="disease-card healthy">
                        <div class="disease-name">✅ Healthy Leaf</div>
                        <div class="severity none">No Disease Detected</div>
                        <p>Your malabar spinach leaf appears to be healthy with no visible disease symptoms.</p>
                    </div>
                `;
        } else {
          data.diagnoses.forEach((diagnosis) => {
            const detection = diagnosis.detection;
            const diseaseInfo = diagnosis.disease_info;
            const severityClass = diseaseInfo.severity
              .toLowerCase()
              .replace(" ", "");
            const cardClass =
              severityClass === "none" ? "healthy" : severityClass;

            resultsHTML += `
                        <div class="disease-card ${cardClass}">
                            <div class="disease-name">${diseaseInfo.name}</div>
                            <div class="confidence">Confidence: ${(
                              detection.confidence * 100
                            ).toFixed(1)}%</div>
                            <div class="severity ${severityClass}">Severity: ${
              diseaseInfo.severity
            }</div>
                            <p><strong>Description:</strong> ${
                              diseaseInfo.description
                            }</p>
                            <p><strong>Treatment:</strong> ${
                              diseaseInfo.treatment
                            }</p>
                            <p><strong>Prevention:</strong> ${
                              diseaseInfo.prevention
                            }</p>
                        </div>
                    `;

            // Add overall recommendation
            if (diseaseInfo.recommendation) {
              const rec = diseaseInfo.recommendation;
              resultsHTML += `
                    <div class="recommendation">
                        <h4>🎯 Recommended Action</h4>
                        <p><strong>Priority:</strong> ${rec.priority}</p>
                        <p><strong>Urgency:</strong> ${rec.urgency}</p>
                        <p><strong>Action:</strong> ${rec.action}</p>
                        ${
                          rec.recommended_treatment
                            ? `<p><strong>Treatment:</strong> ${rec.recommended_treatment}</p>`
                            : ""
                        }
                    </div>
                `;
            }
          });
        }

        resultsContent.innerHTML = resultsHTML;
        analysisSection.style.display = "block";
      }

      function showError(message) {
        error.textContent = message;
        error.style.display = "block";
      }

      function hideError() {
        error.style.display = "none";
      }

      // Check API health on page load
      window.addEventListener("load", async () => {
        try {
          const response = await fetch("/health");
          if (!response.ok) {
            showError(
              "API is not responding. Please ensure the server is running."
            );
          }
        } catch (err) {
          showError(
            "Cannot connect to the API. Please ensure the server is running on port 3001."
          );
        }
      });
    </script>
  </body>
</html>
